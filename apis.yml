aid: aurelius-systems
name: Aurelius Systems
description: 'Aurelius Systems is a defense technology company building autonomous
  directed-energy laser defense platforms for counter-unmanned-aerial-system (C-UAS)
  missions. Its flagship product, Archimedes, fuses high-power lasers, advanced optical
  sensing, and AI-guided autonomous tracking into a compact, field-deployable platform
  that detects, tracks, and neutralizes Group 1 and Group 2 drone threats at the speed
  of light and a fraction of the cost of traditional interceptors. The system runs
  on grid, generator, or commercial off-the-shelf batteries, is designed to operate
  without human operators, and can be networked into modular defensive grids to protect
  troops, bases, and critical infrastructure. Founded in 2025 by Michael LaFramboise
  and John Marmaduke, the company raised a $10M seed round co-led by General Catalyst
  and Draper Associates and is partnered with American Rheinmetall. Aurelius currently
  publishes no public API, developer portal, or software developer surface — it is a
  directed-energy hardware company.'
